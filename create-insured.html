<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Create an Insured — Underwritly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-register page-dashboard">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img
            src="assets/logo.PNG"
            alt="Underwritly"
            width="520"
            height="134"
            class="brand-logo"
            decoding="async"
          />
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/dashboard.html">Dashboard</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="profile-registration profile-registration--lead">
        <div class="container narrow">
          <header class="section-head section-head--center">
            <h2 class="section-title">Create an Insured</h2>
            <p class="section-sub">
              We will email them a verification code and a secure link. Their phone number is used for
              multi-factor authentication alongside email.
            </p>
          </header>

          <form class="access-form" id="create-insured-form" novalidate>
            <div class="form-row">
              <label for="insured-name">Name of insured</label>
              <input type="text" id="insured-name" name="name" required maxlength="200" autocomplete="name" />
            </div>
            <div class="form-row">
              <label for="insured-email">Email address</label>
              <input type="email" id="insured-email" name="email" required autocomplete="email" />
            </div>
            <div class="form-row">
              <label for="insured-phone">Phone number (MFA)</label>
              <input type="tel" id="insured-phone" name="phone" required autocomplete="tel" />
            </div>
            <p class="field-error form-submit-error hidden" id="create-insured-error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-block" id="create-insured-submit">
              Send verification
            </button>
          </form>

          <p class="section-sub section-head--center" style="margin-top: 1.5rem">
            <a href="/dashboard.html">Back to dashboard</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Underwritly. All rights reserved.</p>
      </div>
    </footer>

    <script src="create-insured-page.js"></script>
  </body>
</html>
