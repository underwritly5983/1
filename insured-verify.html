<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Verify your identity — Underwritly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-register page-dashboard">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img
            src="assets/logo.PNG"
            alt="Underwritly"
            width="520"
            height="134"
            class="brand-logo"
            decoding="async"
          />
        </a>
      </div>
    </header>

    <main id="top">
      <section class="profile-registration profile-registration--lead">
        <div class="container narrow">
          <header class="section-head section-head--center">
            <h2 class="section-title">Verify your identity</h2>
            <p class="section-sub">
              No account sign-in is required. Enter the 6-digit code from your email below (your broker may
              also use your phone for extra verification later).
            </p>
          </header>

          <form class="access-form" id="insured-verify-form" novalidate>
            <div class="form-row">
              <label for="mfa-code">Verification code</label>
              <input
                type="text"
                id="mfa-code"
                name="code"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="6"
                required
                autocomplete="one-time-code"
                placeholder="000000"
              />
            </div>
            <p class="field-error form-submit-error hidden" id="insured-verify-error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-block" id="insured-verify-submit">
              Continue
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Underwritly. All rights reserved.</p>
      </div>
    </footer>

    <script src="insured-verify-page.js"></script>
  </body>
</html>
