<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your Underwritly account." />
    <title>Sign in — Underwritly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-register page-login">
    <div id="api-env-warning" class="dev-api-warning hidden" role="status" aria-live="polite">
      <strong>Local setup:</strong> Use <code>npm start</code> from this folder so API routes work.
    </div>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img
            src="assets/logo.PNG"
            alt="Underwritly"
            width="520"
            height="134"
            class="brand-logo"
            decoding="async"
          />
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="profile-registration profile-registration--lead">
        <div class="container narrow">
          <header class="section-head section-head--center">
            <h2 class="section-title">Sign in</h2>
            <p class="section-sub">Use the work email and password you set when you completed registration.</p>
          </header>

          <form class="access-form" id="login-form" novalidate>
            <div class="form-row">
              <label for="login-email">Work email</label>
              <input
                type="email"
                id="login-email"
                name="email"
                autocomplete="email"
                required
                placeholder="name@firm.com"
              />
              <p class="field-error" id="login-email-error" role="alert"></p>
            </div>

            <div class="form-row">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                required
              />
              <p class="field-error" id="login-password-error" role="alert"></p>
            </div>

            <p class="field-error form-submit-error hidden" id="login-form-error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
              Sign in
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Underwritly. All rights reserved.</p>
      </div>
    </footer>

    <script src="login-page.js"></script>
  </body>
</html>
