<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your Underwritly password." />
    <title>Reset password — Underwritly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-register page-login">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img src="assets/logo.PNG" alt="Underwritly" width="520" height="134" class="brand-logo" />
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/login.html">Sign in</a>
        </nav>
      </div>
    </header>
    <main id="top">
      <section class="profile-registration profile-registration--lead">
        <div class="container narrow">
          <header class="section-head section-head--center">
            <h2 class="section-title">Reset password</h2>
            <p class="section-sub">Enter a new password for your account.</p>
          </header>
          <form class="access-form" id="reset-form" novalidate>
            <div class="form-row">
              <label for="reset-password">New password</label>
              <input type="password" id="reset-password" name="password" autocomplete="new-password" required />
              <p class="field-hint">At least 10 characters, including a letter and a number.</p>
              <p class="field-error" id="reset-password-error" role="alert"></p>
            </div>
            <div class="form-row">
              <label for="reset-password-confirm">Confirm new password</label>
              <input
                type="password"
                id="reset-password-confirm"
                name="confirmPassword"
                autocomplete="new-password"
                required
              />
              <p class="field-error" id="reset-password-confirm-error" role="alert"></p>
            </div>
            <p class="field-error form-submit-error hidden" id="reset-form-error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-block" id="reset-submit-btn">Update password</button>
            <p class="form-inline-link"><a href="/login.html">Back to sign in</a></p>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> Underwritly. All rights reserved.</p>
      </div>
    </footer>
    <script src="reset-password-page.js"></script>
  </body>
</html>
